name: Lepestok
options:
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: 1
targets:
  Lepestok:
    type: application
    platform: iOS
    sources: [Lepestok]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lepestok.cyclediary
        INFOPLIST_KEY_CFBundleDisplayName: SuperBaitik
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  LepestokTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LepestokTests]
    dependencies:
      - target: Lepestok
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lepestok.cyclediary.tests
  LepestokUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [LepestokUITests]
    dependencies:
      - target: Lepestok
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lepestok.cyclediary.uitests
schemes:
  Lepestok:
    build:
      targets:
        Lepestok: all
    test:
      targets: [LepestokTests, LepestokUITests]
